<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qwen-Omni-Realtime 视频通话调试</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f0f0f;
            color: #fff;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            text-align: center;
            padding: 20px 0;
            border-bottom: 1px solid #333;
            margin-bottom: 20px;
        }
        
        header h1 {
            font-size: 24px;
            background: linear-gradient(90deg, #00d4ff, #7b2cbf);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .connection-panel {
            background: #1a1a1a;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .form-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: flex-end;
        }
        
        .input-group {
            flex: 1;
            min-width: 200px;
        }
        
        .input-group label {
            display: block;
            font-size: 12px;
            color: #888;
            margin-bottom: 5px;
            text-transform: uppercase;
        }
        
        .input-group input, .input-group select {
            width: 100%;
            padding: 10px 12px;
            background: #2a2a2a;
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
        }
        
        .input-group input:focus, .input-group select:focus {
            outline: none;
            border-color: #00d4ff;
        }
        
        .btn {
            padding: 10px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #00d4ff, #0099cc);
            color: #fff;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(0, 212, 255, 0.4);
        }
        
        .btn-danger {
            background: linear-gradient(135deg, #ff4757, #cc0033);
            color: #fff;
        }
        
        .btn-secondary {
            background: #333;
            color: #fff;
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .video-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        @media (max-width: 900px) {
            .video-section {
                grid-template-columns: 1fr;
            }
        }
        
        .video-box {
            background: #1a1a1a;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
        }
        
        .video-box h3 {
            padding: 15px 20px;
            font-size: 14px;
            color: #888;
            border-bottom: 1px solid #333;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .video-box h3 .status {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #333;
        }
        
        .video-box h3 .status.active {
            background: #00ff88;
            box-shadow: 0 0 10px #00ff88;
        }
        
        .video-container {
            aspect-ratio: 16/9;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        
        video, canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .video-placeholder {
            color: #555;
            font-size: 48px;
        }
        
        .video-info {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 11px;
            color: #aaa;
        }
        
        .controls-bar {
            display: flex;
            gap: 10px;
            padding: 15px 20px;
            background: #1a1a1a;
            border-radius: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .control-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            background: #2a2a2a;
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 13px;
        }
        
        .control-btn:hover {
            background: #333;
        }
        
        .control-btn.active {
            background: rgba(0, 212, 255, 0.2);
            border-color: #00d4ff;
            color: #00d4ff;
        }
        
        .control-btn.muted {
            background: rgba(255, 71, 87, 0.2);
            border-color: #ff4757;
            color: #ff4757;
        }
        
        .chat-section {
            background: #1a1a1a;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            height: 400px;
        }
        
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }
        
        .message {
            margin-bottom: 15px;
            animation: fadeIn 0.3s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .message-user {
            text-align: right;
        }
        
        .message-ai {
            text-align: left;
        }
        
        .message-system {
            text-align: center;
        }
        
        .message-content {
            display: inline-block;
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.5;
        }
        
        .message-user .message-content {
            background: linear-gradient(135deg, #00d4ff, #0099cc);
            color: #fff;
            border-bottom-right-radius: 4px;
        }
        
        .message-ai .message-content {
            background: #2a2a2a;
            color: #fff;
            border-bottom-left-radius: 4px;
        }
        
        .message-system .message-content {
            background: #333;
            color: #888;
            font-size: 12px;
        }
        
        .message-meta {
            font-size: 11px;
            color: #666;
            margin-top: 4px;
        }
        
        .chat-input {
            display: flex;
            gap: 10px;
            padding: 15px 20px;
            border-top: 1px solid #333;
        }
        
        .chat-input input {
            flex: 1;
            padding: 12px 16px;
            background: #2a2a2a;
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
        }
        
        .chat-input input:focus {
            outline: none;
            border-color: #00d4ff;
        }
        
        .logs-section {
            background: #1a1a1a;
            border-radius: 12px;
            margin-top: 20px;
            overflow: hidden;
        }
        
        .logs-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            border-bottom: 1px solid #333;
            cursor: pointer;
        }
        
        .logs-header h3 {
            font-size: 14px;
            color: #888;
        }
        
        .logs-content {
            max-height: 300px;
            overflow-y: auto;
            padding: 15px 20px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 12px;
            line-height: 1.6;
        }
        
        .log-entry {
            padding: 4px 0;
            border-bottom: 1px solid #222;
        }
        
        .log-time {
            color: #666;
        }
        
        .log-type-send { color: #00d4ff; }
        .log-type-recv { color: #00ff88; }
        .log-type-error { color: #ff4757; }
        .log-type-info { color: #888; }
        
        .hidden { display: none; }
        
        .settings-panel {
            background: #1a1a1a;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .settings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
        }
        
        .toggle-switch {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 0;
        }
        
        .toggle-label {
            font-size: 14px;
            color: #ccc;
        }
        
        .toggle {
            width: 48px;
            height: 24px;
            background: #333;
            border-radius: 12px;
            position: relative;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        .toggle.active {
            background: #00d4ff;
        }
        
        .toggle::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            background: #fff;
            border-radius: 50%;
            top: 2px;
            left: 2px;
            transition: transform 0.3s;
        }
        
        .toggle.active::after {
            transform: translateX(24px);
        }
        
        .stats-bar {
            display: flex;
            gap: 20px;
            padding: 10px 20px;
            background: #0f0f0f;
            border-radius: 8px;
            font-size: 12px;
            color: #888;
        }
        
        .stat-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .stat-value {
            color: #00d4ff;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎮 Qwen-Omni-Realtime 视频通话调试平台</h1>
            <p style="color: #666; margin-top: 8px;">支持音频、视频、文本多模态实时交互</p>
        </header>
        
        <!-- 连接配置面板 -->
        <div class="connection-panel">
            <div class="form-group">
                <div class="input-group">
                    <label>WebSocket URL</label>
                    <input type="text" id="wsUrl" placeholder="wss://..." 
                           value="ws://localhost:8081">
                </div>
                <div class="input-group" style="flex: 0.5;">
                    <label>API Key</label>
                    <input type="password" id="apiKey" placeholder="sk-...">
                </div>
                <div class="input-group" style="flex: 0.3;">
                    <label>模型</label>
                    <select id="model">
                        <option value="qwen3.5-omni-plus-realtime">qwen3.5-omni-plus-realtime</option>
                        <option value="qwen-omni-realtime">qwen-omni-realtime</option>
                    </select>
                </div>
                <div class="input-group" style="flex: 0.2;">
                    <label>语音</label>
                    <select id="voice">
                        <option value="Tina">Tina</option>
                        <option value="Shawn">Shawn</option>
                        <option value="Ethan">Ethan</option>
                    </select>
                </div>
                <button class="btn btn-primary" id="connectBtn" onclick="toggleConnection()">
                    连接
                </button>
            </div>
        </div>
        
        <!-- 设置面板 -->
        <div class="settings-panel">
            <div class="settings-grid">
                <div class="toggle-switch">
                    <span class="toggle-label">🎙️ 麦克风输入</span>
                    <div class="toggle active" id="audioToggle" onclick="toggleFeature('audio')"></div>
                </div>
                <div class="toggle-switch">
                    <span class="toggle-label">📹 摄像头输入</span>
                    <div class="toggle" id="videoToggle" onclick="toggleFeature('video')"></div>
                </div>
                <div class="toggle-switch">
                    <span class="toggle-label">🔍 联网搜索</span>
                    <div class="toggle active" id="searchToggle" onclick="toggleFeature('search')"></div>
                </div>
                <div class="toggle-switch">
                    <span class="toggle-label">💬 实时字幕</span>
                    <div class="toggle active" id="captionToggle" onclick="toggleFeature('caption')"></div>
                </div>
            </div>
        </div>
        
        <!-- 视频区域 -->
        <div class="video-section">
            <div class="video-box">
                <h3>
                    <span class="status" id="localStatus"></span>
                    📹 本地摄像头
                </h3>
                <div class="video-container">
                    <video id="localVideo" autoplay muted playsinline></video>
                    <canvas id="videoCanvas" class="hidden"></canvas>
                    <div class="video-placeholder" id="localPlaceholder">📹</div>
                    <div class="video-info" id="localInfo">未启动</div>
                </div>
            </div>
            <div class="video-box">
                <h3>
                    <span class="status" id="remoteStatus"></span>
                    🤖 AI 回复
                </h3>
                <div class="video-container" id="remoteContainer">
                    <div class="video-placeholder">🤖</div>
                    <div class="video-info" id="remoteInfo">等待连接</div>
                </div>
            </div>
        </div>
        
        <!-- 控制栏 -->
        <div class="controls-bar">
            <button class="control-btn" id="micBtn" onclick="toggleMic()">
                <span id="micIcon">🎙️</span>
                <span id="micText">麦克风已开启</span>
            </button>
            <button class="control-btn" id="cameraBtn" onclick="toggleCamera()">
                <span id="cameraIcon">📹</span>
                <span id="cameraText">摄像头已关闭</span>
            </button>
            <button class="control-btn" id="screenBtn" onclick="toggleScreenShare()">
                <span>📺</span>
                <span>屏幕共享</span>
            </button>
            <div class="stats-bar" style="margin-left: auto;">
                <div class="stat-item">
                    <span>WS状态:</span>
                    <span class="stat-value" id="wsStatus">未连接</span>
                </div>
                <div class="stat-item">
                    <span>视频帧率:</span>
                    <span class="stat-value" id="fpsValue">0 fps</span>
                </div>
                <div class="stat-item">
                    <span>音频码率:</span>
                    <span class="stat-value" id="audioRate">0 kbps</span>
                </div>
            </div>
        </div>
        
        <!-- 聊天区域 -->
        <div class="chat-section">
            <div class="chat-messages" id="chatMessages">
                <div class="message message-system">
                    <div class="message-content">欢迎使用 Qwen-Omni-Realtime 调试平台！请配置连接参数后点击"连接"。</div>
                </div>
            </div>
            <div class="chat-input">
                <input type="text" id="textInput" placeholder="输入文字消息... (回车发送)" 
                       onkeypress="handleKeyPress(event)" disabled>
                <button class="btn btn-primary" onclick="sendText()" id="sendBtn" disabled>发送</button>
            </div>
        </div>
        
        <!-- 日志区域 -->
        <div class="logs-section">
            <div class="logs-header" onclick="toggleLogs()">
                <h3>📋 通信日志 (点击折叠)</h3>
                <span id="logCount">0 条记录</span>
            </div>
            <div class="logs-content" id="logsContent"></div>
        </div>
    </div>

    <script src="omni-client.js"></script>
</body>
</html>
